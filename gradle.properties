# Project
mod_version=9.3.4.0
maven_group=com.github.teamfossilsarcheology.fossils-archeology-revival
archives_name=fossils-archeology-revival
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range_lower=1.21.1
minecraft_version_range_upper=1.21.2
parchment_mc_version=1.21.1
# PORT(1.21.1, verified phase 2): parchment date taken from GeckoLib 1.21.1 build (refs/geckolib/gradle/libs.versions.toml); newer dates may exist -> resolves
parchment_date=2024.11.17
# PORT(1.21.1): fabric dropped from the build (module folder kept on disk), only NeoForge is built
enabled_platforms=neoforge

# Fabric loader is still needed by :common for the @Environment annotations (remapped by Architectury)
fabric_loader_version=0.16.7

# NeoForge
# Latest 21.1.x on maven.neoforged.net at time of porting (matches refs/NeoForge 1.21.1 branch head)
neoforge_version=21.1.266
neoforge_version_range=[21.1.0,)
neoforge_loader_version_range=[4,)

# Mod options
mod_id=fossil
mod_name=Fossils and Archeology: Revival
mod_team=TeamFossilsArcheology
mod_license=Code: Mit, Assets: ARR
mod_description=Adding dinosaurs, fossils, and more to Minecraft.
mod_authors= DarkPred, DDinoDan, Dipple_Effect, Indominator, Javaraptor, Robberto08, SealManVI, TotallyNotAHobo, \
  Totemaster, 4f6f3b, Alexthe666, ASDFGirlS7, Blue, JTGhawk137, gegy1000, tmvkrpxl0, tyranno66

# Dependencies
architectury_version=13.0.8
# TerraBlender 1.21.1 branch = tag 4.1.0 + 8 commits (git describe) -> 1.21.1-4.1.0.8
terra_blender_version=4.1.0.8
# PORT(1.21.1, verified phase 2): More Hitboxes 1.21.1 is alpha only (cloudsmith lists 1.9.4-alpha); API not verifiable here -> artifact resolves, API compiles and loads
more_hitboxes_version=1.9.4-alpha
gecko_lib_version=4.9.3
rei_version=16.0.799
jei_version=19.70.0.469
# PORT(1.21.1, verified phase 2): EMI version from Modrinth (1.1.24+1.21.1); maven.terraformersmc.com not reachable for verification -> resolves from maven.terraformersmc.com
emi_version=1.1.24

# Optional NeoForge-only compat (Modrinth maven ids/versions, see PORT_NOTES/build.md)
carry_on_version_neoforge=PV8oLZ1q
farmers_delight_version_neoforge=1.21.1-1.3.4
jade_version_neoforge=15.10.6+neoforge
debug_utils_version_neoforge=GlCTL0rQ
# No 1.21.1 releases found (Modrinth): alex's mobs, prehistoric fauna, delightful, butcher's delight foods, casualness delight
alex_mobs_version=1.22.9
prehistoric_fauna_version=2.3.3
# Create 6 for 1.21.1 exists (6.0.10) but its datagen API changed; Create datagen is disabled (see FossilCreateRecipeProvider)
create_version=6.0.6-150

archives_base_name=fossil

org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true
org.gradle.daemon=true
