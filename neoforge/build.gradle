import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id "com.gradleup.shadow"
    id "com.modrinth.minotaur"
    id "net.darkhax.curseforgegradle"
}

architectury {
    platformSetupLoomIde()
    neoForge {
        // PORT(1.21.1): Architectury looks up @ExpectPlatform implementations in "<package>.<platformPackage>.<Class>Impl".
        // The default for NeoForge is "neoforge"; we keep the old "forge" sub-packages (PORTING.md: package names stay),
        // exactly like architectury-api's own neoforge module does (refs/architectury-api/neoforge/build.gradle).
        platformPackage = "forge"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    mappings loom.layered() {
        officialMojangMappings() {
            nameSyntheticMembers = true
        }
        parchment("org.parchmentmc.data:parchment-$parchment_mc_version:$parchment_date@zip")
    }
    neoForge "net.neoforged:neoforge:$neoforge_version"
    modApi "dev.architectury:architectury-neoforge:$architectury_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "software.bernie.geckolib:geckolib-neoforge-$minecraft_version:$gecko_lib_version"
    modImplementation "com.github.glitchfiend:TerraBlender-neoforge:$minecraft_version-$terra_blender_version"
    // PORT(1.21.1, verified phase 2): artifact name assumed from cloudsmith package list (morehitboxes-neoforge-1.21.1 1.9.4-alpha) -> resolves, loads at runtime
    modImplementation "com.github.darkpred.morehitboxes:morehitboxes-neoforge-$minecraft_version:$more_hitboxes_version"

    // PORT(1.21.1): NeoForge bundles MixinExtras (jar-in-jar) at runtime, only the compile API is needed here.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))

    //Optional
    modImplementation "maven.modrinth:jade:$jade_version_neoforge"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:$rei_version"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:$rei_version"
    modCompileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"
    //modRuntimeOnly "mezz.jei:jei-$minecraft_version-neoforge:$jei_version"
    // PORT(1.21.1, verified phase 2): EMI coordinates for 1.21.1 assumed (dev.emi:emi-neoforge:<ver>+1.21.1). MultiOutputEmiRecipeImpl uses -> resolves and compiles
    // EMI internals (runtime.EmiTagKey, registry.EmiTags) so the full jar is needed at compile time.
    modCompileOnly "dev.emi:emi-neoforge:$emi_version+$minecraft_version:api"
    modCompileOnly "dev.emi:emi-neoforge:$emi_version+$minecraft_version"

    // Carry On 2.2.6 (1.21.1 NeoForge, Modrinth version id); PickupHandlerMixin target verified against its 1.21.1 source
    modCompileOnly "maven.modrinth:carry-on:$carry_on_version_neoforge"
    // Farmer's Delight 1.21.1 (Modrinth version number "1.21.1-1.3.4"; fields used by FarmersDelightCompat verified against FD source 1.21 branch)
    modCompileOnly "maven.modrinth:farmers-delight:$farmers_delight_version_neoforge"

    // PORT(1.21.1): the Farmer's Delight add-on compat classes are commented out until each add-on is verified against its
    // 1.21.1 jar (see PORT_NOTES/build.md for which add-ons have 1.21.1 NeoForge releases). Old 1.20.1 coordinates kept:
    //modCompileOnly "maven.modrinth:oceans-delight:1.0.2-1.20"
    //modCompileOnly "curse.maven:nethers-delight-496394:4736227" //1.20.1-4.0
    //modCompileOnly "maven.modrinth:delightful:3.8-1.20.1"
    //modCompileOnly "maven.modrinth:ars-nouveau:4.12.7" //for delightful
    //modCompileOnly "maven.modrinth:enders-delight:1.1.3" //1.20.1-1.1.3
    //modCompileOnly "maven.modrinth:ends-delight:2.5.1+forge.1.20.1"
    //modCompileOnly "maven.modrinth:crabbers-delight:1.2.3" //1.20.1-1.2.3
    //modCompileOnly "maven.modrinth:miners-delight:1.20.1-1.2.3"
    //modCompileOnly "maven.modrinth:corn-delight:1.0.4-1.20.1"
    //modCompileOnly "maven.modrinth:mmlib:1.4.4-1.20.1" //For corn delight
    //modCompileOnly "maven.modrinth:cultural-delights:0.16.5" //1.20.1
    //modCompileOnly "maven.modrinth:pineapple-delight:1.0.13" //1.20.1
    //modCompileOnly "maven.modrinth:festive-delight:2.0.0" //1.20.1-2.0.0
    //modCompileOnly "maven.modrinth:butchers-delight-foods:1.20.11.0.3"
    //modCompileOnly "maven.modrinth:coffee-delight:1.5.1" //1.20.1-1.5.1
    //modCompileOnly "maven.modrinth:casualness-delight:1.20.1-0.4n"
    //modCompileOnly "maven.modrinth:seed-delight:TDZM7AA5" //1.20.1-1.0.1
    //modCompileOnly "curse.maven:argentinasdelight-831127:4818264" //1.20.1 3.0 beta
    //modCompileOnly "maven.modrinth:brewin-and-chewin:1.20.1-3.2.1"
    //modCompileOnly "curse.maven:alexs-delight-556448:5028450" //1.20.1-1.5
    //modCompileOnly "curse.maven:farmers-respite-551453:5543547" //1.20.1-2.1.2

    // PORT(1.21.1): Alex's Mobs has no 1.21.1 release -> AlexsMobsCompat is commented out.
    //modCompileOnly "maven.modrinth:alexs-mobs:$alex_mobs_version"

    // PORT(1.21.1): Create 6 (1.21.1) changed its datagen API (ProcessingRecipeBuilder, conditions) -> FossilCreateRecipeProvider
    // is commented out; the generated JSON in common/src/generated stays valid input for phase 2.
    //modCompileOnly("com.simibubi.create:create-1.21.1:$create_version:slim") { transitive false }
    //modCompileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:$flywheel_version"

    // PORT(1.21.1): Prehistoric Fauna has no 1.21.1 release -> PFaunaTagsProvider is commented out.
    //modCompileOnly "maven.modrinth:prehistoric-fauna:$prehistoric_fauna_version"
    //modLocalRuntime "maven.modrinth:prehistoric-fauna:$prehistoric_fauna_version"

    // 1.21.1-1.0.9-neoforge
    modLocalRuntime "maven.modrinth:debugutils:$debug_utils_version_neoforge"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        data {
            //regen run config if changed
            data()
            programArgs "--all", "--mod", "$mod_id"
            programArgs "--output", project(":common").file("src/generated/resources/").absolutePath
            programArgs "--existing", project(":common").file("src/main/resources/").absolutePath
        }
        // PORT(1.21.1): headless game test server (runs the @GameTestHolder classes in forge/tests and exits with the failure count)
        gameTestServer {
            server()
            property "neoforge.gameTestServer", "true"
            property "neoforge.enabledGameTestNamespaces", "$mod_id"
        }
    }
    // PORT(1.21.1): NeoForge has no "forge { mixinConfig ... }": mixin configs are declared in META-INF/neoforge.mods.toml
    // ([[mixins]] entries) and the access widener is converted to an access transformer by remapJar (atAccessWideners).
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveAppendix = "neoforge-$minecraft_version"
    // PORT(1.21.1): converts common's access widener into META-INF/accesstransformer.cfg (same as architectury-api neoforge)
    atAccessWideners.add "fossil.accesswidener"
}

tasks.named("modrinth") {
    modrinth {
        token = "${project.findProperty("MODRINTH_TOKEN") ?: "no value"}"
        projectId = "IJY7IqPP"
        versionNumber = "$minecraft_version-$mod_version-${project.name}"
        versionType = "release"
        uploadFile = tasks.remapJar
        versionName = "$mod_version for NeoForge $minecraft_version"
        loaders = ["neoforge"]
        debugMode = true
        dependencies {
            required.project("architectury-api")
            required.project("geckolib")
            required.project("terrablender")
            required.project("more-hitboxes")
        }
        changelog = rootProject.file("CHANGELOG.md").text
    }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    group = "publishing"
    description = "Publishes jar to CurseForge"
    apiToken = project.findProperty("CURSEFORGE_TOKEN") ?: "no value"
    debugMode = true
    def mainFile = upload(223908, tasks.remapJar)
    mainFile.displayName = "$mod_version for NeoForge $minecraft_version"
    mainFile.addEnvironment("NeoForge")
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.releaseType = "release"
    mainFile.addRequirement("architectury-api", "geckolib", "terrablender", "more-hitboxes")
}

tasks.named("publish") {
    finalizedBy("modrinth", "publishCurseForge")
}
