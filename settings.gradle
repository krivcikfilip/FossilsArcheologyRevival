pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

plugins {
    // PORT(1.21.1): lets Gradle auto-provision the Java 21 toolchain when no local JDK 21 is installed
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.9.0"
}

include("common")
// PORT(1.21.1): the fabric/ and forge/ folders stay on disk but are no longer part of the build.
//include("fabric")
//include("forge")
include("neoforge")

rootProject.name = "FossilsArcheologyRevival"
